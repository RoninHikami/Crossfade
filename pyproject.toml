[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossfade"
version = "0.1.0"
description = "Перенос лайкнутых треков между стриминговыми сервисами (Яндекс Музыка, Spotify)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "spotipy>=2.26",
    "yandex-music>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
crossfade = "crossfade.cli:main"

[tool.setuptools.packages.find]
include = ["crossfade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
