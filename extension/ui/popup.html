<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Crossfade</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="24" height="24">
    <h1>Crossfade</h1>
    <button id="open-settings" class="icon" title="Настройки" aria-label="Настройки">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main>
    <section class="services">
      <div class="service" data-service="yandex">
        <div class="logo yandex">Я</div>
        <div class="info">
          <div class="name">Яндекс Музыка</div>
          <div class="state">Не подключено</div>
        </div>
        <button class="connect">Подключить</button>
      </div>
      <div class="service" data-service="spotify">
        <div class="logo spotify">S</div>
        <div class="info">
          <div class="name">Spotify</div>
          <div class="state">Не подключено</div>
        </div>
        <button class="connect">Подключить</button>
      </div>
      <div class="service" data-service="zvuk">
        <div class="logo zvuk">З</div>
        <div class="info">
          <div class="name">Звук</div>
          <div class="state">Не подключено</div>
        </div>
        <button class="connect">Подключить</button>
      </div>
      <div class="service" data-service="youtube">
        <div class="logo youtube">YT</div>
        <div class="info">
          <div class="name">YouTube Music</div>
          <div class="state">Не подключено</div>
        </div>
        <button class="connect">Подключить</button>
      </div>
    </section>

    <div id="auth-error" class="error hidden"></div>

    <section>
      <div class="label">Куда переносить</div>
      <div class="route">
        <select id="source" aria-label="Откуда"></select>
        <button id="swap" class="icon" title="Поменять местами" aria-label="Поменять местами">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/></svg>
        </button>
        <select id="target" aria-label="Куда"></select>
      </div>
      <label class="toggle small">
        <input type="checkbox" id="both-ways">
        <span class="track"></span>
        <span>И обратно — в обе стороны</span>
      </label>
    </section>

    <section id="idle">
      <button id="start" class="primary big">Перенести лайки</button>
      <p class="hint muted small" id="start-hint"></p>
      <div id="last-run" class="last-run hidden"></div>
    </section>

    <section id="running" class="hidden">
      <div class="progress-head">
        <span id="phase">Подготовка…</span>
        <span id="counter" class="muted"></span>
      </div>
      <div class="bar"><div id="bar-fill"></div></div>
      <div id="current" class="muted small current"></div>
      <button id="stop">Остановить</button>
    </section>

    <section class="auto">
      <label class="toggle">
        <input type="checkbox" id="auto">
        <span class="track"></span>
        <span>Автоперенос</span>
      </label>
      <select id="interval" aria-label="Как часто">
        <option value="30">каждые 30 минут</option>
        <option value="60">каждый час</option>
        <option value="360">каждые 6 часов</option>
        <option value="1440">раз в день</option>
      </select>
    </section>

    <p class="footnote muted small">Лайки только добавляются — ничего не удаляется.</p>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
